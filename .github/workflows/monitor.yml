name: Monitor BiliBili Dynamics
on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check
        env:
          BILI_UID: ${{ vars.BILI_UID }}
          BILI_SESSDATA: ${{ secrets.BILI_SESSDATA }}
          BILI_JCT: ${{ secrets.BILI_JCT }}
          BILI_DEDE_USERID: ${{ secrets.BILI_DEDE_USERID }}
          DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python monitor.py
      - name: Commit state
        run: |
          git config user.name "bot"
          git config user.email "bot@github.com"
          git add state.json
          git diff --quiet && git diff --staged --quiet || git commit -m "update state"
          git push
